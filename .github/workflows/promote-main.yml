name: Promotion checks (main)

on:
  pull_request:
    branches: [main]

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint (incl. complexity limits)
        run: npx eslint .
      - name: LLM slop check
        run: bash scripts/ci/slop-check.sh
      - name: Expo doctor (dependency/config health)
        run: npx expo-doctor
        continue-on-error: false
      # The branch that ships had the weaker pipeline: typecheck and lint pass
      # against import graphs Metro cannot resolve, which is exactly how a
      # missing peer dependency reached main unnoticed (#55). Bundling is the
      # only check that walks the real graph, so it belongs on both gates.
      - name: Bundle iOS
        run: npx expo export --platform ios --output-dir /tmp/expo-export-ios
      - name: Bundle Android
        run: npx expo export --platform android --output-dir /tmp/expo-export-android

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    # gitleaks-action lists the PR's commits via the API; this repo's default
    # GITHUB_TOKEN is restricted, so grant read access explicitly.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
